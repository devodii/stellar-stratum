name: upgrade-test

on:
  push:
    branches: ['scratch/stage-*']
env:
  STAGE: ${{ github.ref_name == 'scratch/stage-upload' && 'upload' || 'upgrade' }}

jobs:
  propose:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: scratch
      - uses: actions/checkout@v4
        with:
          ref: feat/ci-signing-action
          path: stratum
      - uses: stellar/stellar-cli@v28.1.0

      - if: env.STAGE == 'upload'
        uses: ./stratum/action
        with:
          source-account: ${{ vars.DEPLOYER_ACCOUNT }}
          network: testnet
          comment: commit
          github-token: ${{ github.token }}
          wasm: scratch/wasm/v2.wasm

      - if: env.STAGE == 'upgrade'
        id: build
        run: |
          hash="$(shasum -a 256 scratch/wasm/v2.wasm | cut -d' ' -f1)"
          stellar contract invoke --id "${{ vars.CONTRACT_ID }}" \
            --source-account "${{ vars.DEPLOYER_ACCOUNT }}" --network testnet --build-only \
            -- upgrade --new_wasm_hash "$hash" > upgrade.xdr
          echo "xdr=$(cat upgrade.xdr)" >> "$GITHUB_OUTPUT"

      - if: env.STAGE == 'upgrade'
        uses: ./stratum/action
        with:
          source-account: ${{ vars.DEPLOYER_ACCOUNT }}
          network: testnet
          comment: commit
          github-token: ${{ github.token }}
          xdr: ${{ steps.build.outputs.xdr }}
