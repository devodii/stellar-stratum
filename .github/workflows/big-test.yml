name: big-test
on:
  push:
    branches: ['scratch/big']
permissions:
  contents: write
jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: scratch
      - uses: actions/checkout@v4
        with:
          ref: feat/ci-signing-action
          path: stratum
      - uses: stellar/stellar-cli@v28.1.0
      - id: propose
        uses: ./stratum/action
        with:
          source-account: GDCHAYNHYTRPRV36UWFZEX2LD2TH7ZF3OATU5RFN2BTULUMXIISRTDRD
          network: testnet
          wasm: scratch/wasm/big.wasm
          comment: commit
          github-token: ${{ github.token }}
      - run: |
          echo "id=[${{ steps.propose.outputs.refractor-id }}] artifact=${{ steps.propose.outputs.artifact-name }}"
