name: big-test
on:
  push:
    branches: ['scratch/big']
jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: scratch
      - uses: actions/checkout@v4
        with:
          ref: feat/ci-signing-action
          path: stratum
      - id: propose
        uses: ./stratum/action
        with:
          source-account: GDCHAYNHYTRPRV36UWFZEX2LD2TH7ZF3OATU5RFN2BTULUMXIISRTDRD
          network: testnet
          wasm: scratch/wasm/big.wasm
      - uses: actions/upload-artifact@v4
        if: steps.propose.outputs.artifact-path != ''
        with:
          path: ${{ steps.propose.outputs.artifact-path }}
      - run: echo "id=[${{ steps.propose.outputs.refractor-id }}] path=${{ steps.propose.outputs.artifact-path }}"
